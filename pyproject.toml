[project]
name = "daemonhunter"
version = "0.1.0"
description = "a self-hosted platform for monitoring and managing servers, devices, and services."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]

authors = [
    { name = "tatinCode", email = "justinbusalpa22@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "psutil>=7.2.2",
    "pwdlib[argon2]>=0.3.0",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
daemonhunter = "daemonhunter.cli:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
browser = [
    "playwright>=1.50.0",
]
