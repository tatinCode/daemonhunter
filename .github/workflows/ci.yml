name: CI

on:
  push:
    branches: [main]

  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install uv and select Python
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run --frozen pytest

  browser:
    name: Chromium dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install uv and select Python
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --group browser
      - run: uv run --frozen --group browser playwright install --with-deps chromium
      - run: uv run --frozen --group browser pytest tests/browser --run-browser -q




